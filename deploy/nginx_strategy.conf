# Merge these blocks into the main site vhost, for example:
# /www/server/panel/vhost/nginx/www.gfm156.com.conf
#
# This template assumes Streamlit is already running on 127.0.0.1:8501
# with `server.baseUrlPath = "strategy"`.
#
# Key points:
# - keep `location ^~ /strategy/` so generic static-file regex rules do not steal
#   Streamlit asset requests
# - keep `proxy_pass` without a trailing slash so `/strategy/...` is preserved
# - websocket upgrade headers are required for `/_stcore/stream`

location = /strategy {
    return 302 /strategy/;
}

location ^~ /strategy/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_redirect off;
}

# After merging, verify:
# - https://www.gfm156.com/strategy
# - https://www.gfm156.com/strategy/stock-analysis
# - https://www.gfm156.com/strategy/stocks-analysis
