# Merge these blocks into the main site vhost, for example:
# /www/server/panel/vhost/nginx/www.gfm156.com.conf
#
# This template assumes Streamlit is already running on 127.0.0.1:8501
# with `server.baseUrlPath = "strategy"`.
#
# Key points:
# - keep `location ^~ /strategy/` so generic static-file regex rules do not steal
#   Streamlit asset requests
# - keep `proxy_pass` without a trailing slash so `/strategy/...` is preserved
# - websocket upgrade headers are required for `/_stcore/stream`
# - the live host already enables gzip globally for HTML, JS and CSS; do not
#   duplicate gzip directives in this vhost fragment

location = /strategy {
    return 302 /strategy/$is_args$args;
}

# Streamlit build assets use content-hashed filenames. Keep this location
# separate from websocket traffic so responses can be buffered and cached.
location ^~ /strategy/static/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_buffering on;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_redirect off;
}

# Health, host configuration and websocket traffic are session/runtime state.
# Never give these endpoints the immutable static-asset policy.
location ^~ /strategy/_stcore/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_redirect off;
}

location ^~ /strategy/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_redirect off;
}

# After merging, verify:
# - https://www.gfm156.com/strategy
# - https://www.gfm156.com/strategy/stock-analysis
# - https://www.gfm156.com/strategy/stocks-analysis
# - https://www.gfm156.com/strategy/model-evaluation
# - https://www.gfm156.com/strategy/final-report
# - `curl -I` on a real `/strategy/static/...` asset returns immutable caching
# - `/strategy/_stcore/health` returns 200 without immutable caching
